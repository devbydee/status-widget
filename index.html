<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --meta: #d7cdbf;
  --text: #fff8ec;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: transparent;
  overflow: hidden;
}

body {
  color: var(--text);
  font-family: "Work Sans", Arial, Helvetica, sans-serif;
  font-size: 8px;
  font-weight: 500;
  line-height: 1.18;
}

#statuscafe {
  width: 100%;
  padding: 3px 4px 2px;
  background: transparent;
}

#statuscafe-username {
  display: block;
  margin: 0 0 2px;
  color: var(--meta);
  font-size: 7px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#statuscafe-username a {
  color: inherit;
  text-decoration: none;
}

#statuscafe-content {
  display: block;
  color: var(--text);
  font-size: 8px;
  font-weight: 500;
  line-height: 1.18;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}

#statuscafe-content a {
  color: inherit;
  text-decoration: none;
}

.loading {
  color: rgba(255, 248, 236, 0.65);
}
</style>
</head>
<body>
<div id="statuscafe">
  <div id="statuscafe-username">D3OFI</div>
  <div id="statuscafe-content" class="loading">loading status...</div>
</div>

<script>
const STATUS_USER = "d3ofi";
const STATUS_PAGE = "https://status.cafe/users/" + STATUS_USER;
const ATOM_URL = STATUS_PAGE + ".atom";

const metaEl = document.getElementById("statuscafe-username");
const contentEl = document.getElementById("statuscafe-content");

function sendHeight() {
  window.parent.postMessage(
    {
      type: "d-status-height",
      height: Math.ceil(document.documentElement.scrollHeight)
    },
    "*"
  );
}

function cleanText(value) {
  return String(value || "").replace(/\s+/g, " ").trim();
}

function timeAgo(date) {
  const diff = Math.max(0, Date.now() - date.getTime());
  const minute = 60000;
  const hour = 60 * minute;
  const day = 24 * hour;

  if (diff < minute) return "JUST NOW";

  if (diff < hour) {
    const amount = Math.floor(diff / minute);
    return amount + " MINUTE" + (amount === 1 ? "" : "S") + " AGO";
  }

  if (diff < day) {
    const amount = Math.floor(diff / hour);
    return amount + " HOUR" + (amount === 1 ? "" : "S") + " AGO";
  }

  const amount = Math.floor(diff / day);
  return amount + " DAY" + (amount === 1 ? "" : "S") + " AGO";
}

function setStatus(text, date) {
  const age = date && !Number.isNaN(date.getTime()) ? timeAgo(date) : "";
  metaEl.innerHTML =
    '<a href="' + STATUS_PAGE + '" target="_blank" rel="noopener noreferrer">' +
    STATUS_USER.toUpperCase() +
    "</a>" +
    (age ? " - " + age : "");

  contentEl.textContent = cleanText(text) || "no status yet";
  contentEl.classList.remove("loading");

  requestAnimationFrame(sendHeight);
  setTimeout(sendHeight, 150);
  setTimeout(sendHeight, 500);
}

async function loadAtomStatus() {
  const response = await fetch(ATOM_URL + "?cache=" + Date.now());

  if (!response.ok) {
    throw new Error("status feed failed");
  }

  const xmlText = await response.text();
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  const entry = doc.querySelector("entry");

  if (!entry) {
    throw new Error("no status entry");
  }

  const text =
    entry.querySelector("content")?.textContent ||
    entry.querySelector("summary")?.textContent ||
    entry.querySelector("title")?.textContent ||
    "";

  const dateText =
    entry.querySelector("updated")?.textContent ||
    entry.querySelector("published")?.textContent ||
    "";

  setStatus(text, dateText ? new Date(dateText) : null);
}

function loadFallback() {
  const fallbackUser = document.createElement("div");
  const fallbackContent = document.createElement("div");

  fallbackUser.id = "statuscafe-fallback-user";
  fallbackContent.id = "statuscafe-fallback-content";

  fallbackUser.style.display = "none";
  fallbackContent.style.display = "none";

  document.body.appendChild(fallbackUser);
  document.body.appendChild(fallbackContent);

  const originalUser = document.getElementById("statuscafe-username");
  const originalContent = document.getElementById("statuscafe-content");

  originalUser.id = "statuscafe-username-display";
  originalContent.id = "statuscafe-content-display";

  fallbackUser.id = "statuscafe-username";
  fallbackContent.id = "statuscafe-content";

  const script = document.createElement("script");
  script.src = "https://status.cafe/current-status.js?name=" + encodeURIComponent(STATUS_USER);
  document.body.appendChild(script);

  setTimeout(() => {
    const rawMeta = cleanText(fallbackUser.textContent);
    const rawContent = cleanText(fallbackContent.textContent);

    fallbackUser.remove();
    fallbackContent.remove();

    originalUser.id = "statuscafe-username";
    originalContent.id = "statuscafe-content";

    const match = rawMeta.match(/(\d+)\s+(minute|hour|day)s?\s+ago/i);
    const age = match ? match[0].toUpperCase() : "";

    originalUser.innerHTML =
      '<a href="' + STATUS_PAGE + '" target="_blank" rel="noopener noreferrer">' +
      STATUS_USER.toUpperCase() +
      "</a>" +
      (age ? " - " + age : "");

    originalContent.textContent =
      rawContent && rawContent.toLowerCase() !== "loading status..."
        ? rawContent
        : "status unavailable";

    originalContent.classList.remove("loading");
    requestAnimationFrame(sendHeight);
  }, 1200);
}

loadAtomStatus().catch(loadFallback);

window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);

if ("ResizeObserver" in window) {
  new ResizeObserver(sendHeight).observe(document.body);
}
</script>
</body>
</html>
