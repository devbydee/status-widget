<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@font-face {
  font-family: "DOS";
  src: url("https://file.garden/ZswAc6hgIRcOzeXF/Web437_DOS-V_re_ANK24.woff2") format("woff2");
}

html,
body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: #d2bea4;
  font-family: "DOS", monospace;
  font-size: 11px;
  line-height: 1.45;
  overflow: hidden;
}

#statuscafe {
  margin: 0;
  padding: 0;
  background: transparent;
  border: 0;
}

#statuscafe-username,
.status-meta {
  display: block;
  margin: 0 0 4px;
  padding: 0;
  color: rgba(210, 190, 164, 0.58);
  font-size: 10px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#statuscafe-username a,
.status-meta a {
  color: rgba(210, 190, 164, 0.68);
  text-decoration: none;
}

#statuscafe-content {
  margin: 0;
  padding: 0;
  color: #d2bea4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: normal;
}

#statuscafe-content a {
  color: #d2bea4;
  text-decoration: none;
}

.loading {
  color: rgba(210, 190, 164, 0.55);
}
</style>
</head>

<body>
  <div id="statuscafe">
    <div id="statuscafe-username" class="status-meta">d3ofi</div>
    <div id="statuscafe-content" class="loading">loading status...</div>
  </div>

<script>
const STATUS_USER = "d3ofi";
const STATUS_PAGE = "https://status.cafe/users/" + STATUS_USER;
const ATOM_URL = STATUS_PAGE + ".atom";

const metaEl = document.getElementById("statuscafe-username");
const contentEl = document.getElementById("statuscafe-content");

function sendHeight() {
  const height = document.documentElement.scrollHeight;
  window.parent.postMessage(
    {
      type: "d-status-height",
      height: height
    },
    "*"
  );
}

function timeAgo(date) {
  const diff = Math.max(0, Date.now() - date.getTime());
  const minute = 60 * 1000;
  const hour = 60 * minute;
  const day = 24 * hour;

  if (diff < minute) return "just now";
  if (diff < hour) {
    const mins = Math.floor(diff / minute);
    return mins + " minute" + (mins === 1 ? "" : "s") + " ago";
  }
  if (diff < day) {
    const hours = Math.floor(diff / hour);
    return hours + " hour" + (hours === 1 ? "" : "s") + " ago";
  }

  const days = Math.floor(diff / day);
  return days + " day" + (days === 1 ? "" : "s") + " ago";
}

function cleanText(text) {
  return (text || "")
    .replace(/\s+/g, " ")
    .trim();
}

function finish() {
  contentEl.classList.remove("loading");
  requestAnimationFrame(sendHeight);
  setTimeout(sendHeight, 300);
}

function loadStatusCafeFallback() {
  const script = document.createElement("script");
  script.src = "https://status.cafe/current-status.js?name=" + encodeURIComponent(STATUS_USER);
  script.defer = true;
  document.body.appendChild(script);

  setTimeout(() => {
    if (!cleanText(metaEl.textContent)) {
      metaEl.innerHTML = `<a href="${STATUS_PAGE}" target="_blank">${STATUS_USER}</a>`;
    }

    if (!cleanText(contentEl.textContent) || cleanText(contentEl.textContent) === "loading status...") {
      contentEl.textContent = "status unavailable";
    }

    finish();
  }, 1200);
}

async function loadAtomStatus() {
  const response = await fetch(ATOM_URL + "?cache=" + Date.now());
  if (!response.ok) throw new Error("status feed failed");

  const xmlText = await response.text();
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  const entry = doc.querySelector("entry");

  if (!entry) throw new Error("no status entry");

  const statusText = cleanText(
    entry.querySelector("content")?.textContent ||
    entry.querySelector("summary")?.textContent ||
    entry.querySelector("title")?.textContent
  );

  const updatedText =
    entry.querySelector("updated")?.textContent ||
    entry.querySelector("published")?.textContent;

  const updatedDate = updatedText ? new Date(updatedText) : null;
  const ageText = updatedDate && !isNaN(updatedDate) ? " • " + timeAgo(updatedDate) : "";

  metaEl.innerHTML = `<a href="${STATUS_PAGE}" target="_blank">${STATUS_USER}</a>${ageText}`;
  contentEl.textContent = statusText || "no status yet";
  finish();
}

loadAtomStatus().catch(loadStatusCafeFallback);
window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);
new ResizeObserver(sendHeight).observe(document.body);
</script>
</body>
</html>
