<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>status</title>

  <style>
    :root {
      --cream: #eee9dc;
      --red: #8b4741;
      --soft-red: #a06d68;
    }

    html.dark {
      --cream: #262220;
      --red: #d3aaa5;
      --soft-red: #a9827e;
    }

    * {
      box-sizing: border-box;
      cursor: url("https://cdn.cursors-4u.net/previews/tiny-grey-pointer-544443a3-32.webp") 32 32, auto !important;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      line-height: 1.35;
    }

    ::selection {
      background: var(--red);
      color: var(--cream);
    }

    #statuscafe {
      width: 100%;
      padding: 0;
    }

    #statuscafe-username {
      margin: 0 0 4px;
      color: var(--soft-red);
      font-size: 9px;
      line-height: 1.2;
    }

    #statuscafe-username a {
      color: inherit;
      text-decoration: none;
    }

    #statuscafe-username a:hover,
    #statuscafe-username a:focus-visible {
      background: var(--red);
      color: var(--cream);
      outline: none;
    }

    #statuscafe-content {
      color: var(--red);
      font-size: 11px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    #statuscafe-content a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .loading {
      color: var(--soft-red);
    }
  </style>
</head>

<body>
  <div id="statuscafe">
    <div id="statuscafe-username">d3ofi</div>
    <div id="statuscafe-content" class="loading">loading status...</div>
  </div>

  <script>
    const STATUS_USER = "d3ofi";
    const STATUS_PAGE = `https://status.cafe/users/${STATUS_USER}`;
    const ATOM_URL = `${STATUS_PAGE}.atom`;

    const metaEl = document.getElementById("statuscafe-username");
    const contentEl = document.getElementById("statuscafe-content");

    function applyTheme(theme) {
      document.documentElement.classList.toggle("dark", theme === "dark");
    }

    try {
      const savedTheme = localStorage.getItem("hiddentrack-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(savedTheme || (prefersDark ? "dark" : "light"));
    } catch {
      applyTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }

    window.addEventListener("message", event => {
      if (event.data?.type === "hiddentrack-theme") {
        applyTheme(event.data.theme);
      }
    });

    function sendHeight() {
      window.parent.postMessage(
        {
          type: "hiddentrack-status-height",
          height: Math.ceil(document.documentElement.scrollHeight)
        },
        "*"
      );
    }

    function cleanText(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function timeAgo(date) {
      const diff = Math.max(0, Date.now() - date.getTime());
      const minute = 60000;
      const hour = minute * 60;
      const day = hour * 24;

      if (diff < minute) {
        return "just now";
      }

      if (diff < hour) {
        const amount = Math.floor(diff / minute);
        return `${amount} minute${amount === 1 ? "" : "s"} ago`;
      }

      if (diff < day) {
        const amount = Math.floor(diff / hour);
        return `${amount} hour${amount === 1 ? "" : "s"} ago`;
      }

      const amount = Math.floor(diff / day);
      return `${amount} day${amount === 1 ? "" : "s"} ago`;
    }

    function setStatus(text, date) {
      const age = date && !Number.isNaN(date.getTime()) ? timeAgo(date) : "";

      metaEl.innerHTML =
        `<a href="${STATUS_PAGE}" target="_blank" rel="noopener noreferrer">${STATUS_USER}</a>` +
        (age ? ` · ${age}` : "");

      contentEl.textContent = cleanText(text) || "no status yet";
      contentEl.classList.remove("loading");

      requestAnimationFrame(sendHeight);
      setTimeout(sendHeight, 150);
      setTimeout(sendHeight, 500);
    }

    async function loadAtomStatus() {
      const response = await fetch(`${ATOM_URL}?cache=${Date.now()}`);

      if (!response.ok) {
        throw new Error("status feed failed");
      }

      const xmlText = await response.text();
      const doc = new DOMParser().parseFromString(xmlText, "application/xml");
      const entry = doc.querySelector("entry");

      if (!entry) {
        throw new Error("no status entry");
      }

      const text =
        entry.querySelector("content")?.textContent ||
        entry.querySelector("summary")?.textContent ||
        entry.querySelector("title")?.textContent ||
        "";

      const dateText =
        entry.querySelector("updated")?.textContent ||
        entry.querySelector("published")?.textContent ||
        "";

      setStatus(text, dateText ? new Date(dateText) : null);
    }

    function loadFallback() {
      const fallbackUser = document.createElement("div");
      const fallbackContent = document.createElement("div");

      fallbackUser.style.display = "none";
      fallbackContent.style.display = "none";
      fallbackUser.id = "statuscafe-username-fallback";
      fallbackContent.id = "statuscafe-content-fallback";

      document.body.append(fallbackUser, fallbackContent);

      const displayUser = metaEl;
      const displayContent = contentEl;

      displayUser.id = "statuscafe-username-display";
      displayContent.id = "statuscafe-content-display";
      fallbackUser.id = "statuscafe-username";
      fallbackContent.id = "statuscafe-content";

      const script = document.createElement("script");
      script.src = `https://status.cafe/current-status.js?name=${encodeURIComponent(STATUS_USER)}`;
      document.body.appendChild(script);

      setTimeout(() => {
        const rawMeta = cleanText(fallbackUser.textContent);
        const rawContent = cleanText(fallbackContent.textContent);
        const match = rawMeta.match(/(\d+)\s+(minute|hour|day)s?\s+ago/i);
        const age = match ? match[0].toLowerCase() : "";

        fallbackUser.remove();
        fallbackContent.remove();

        displayUser.id = "statuscafe-username";
        displayContent.id = "statuscafe-content";
        displayUser.innerHTML =
          `<a href="${STATUS_PAGE}" target="_blank" rel="noopener noreferrer">${STATUS_USER}</a>` +
          (age ? ` · ${age}` : "");
        displayContent.textContent =
          rawContent && rawContent.toLowerCase() !== "loading status..."
            ? rawContent
            : "status unavailable";
        displayContent.classList.remove("loading");

        requestAnimationFrame(sendHeight);
      }, 1200);
    }

    loadAtomStatus().catch(loadFallback);

    window.addEventListener("load", sendHeight);
    window.addEventListener("resize", sendHeight);

    if ("ResizeObserver" in window) {
      new ResizeObserver(sendHeight).observe(document.body);
    }
  </script>
</body>
</html>
